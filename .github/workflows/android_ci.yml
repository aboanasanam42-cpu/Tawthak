name: Android CI & Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Build, Validate & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Secrets & Environment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Configuring environment variables for Android build..."
          touch .env
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
            echo "GEMINI_API_KEY configured securely."
          else
            echo "GEMINI_API_KEY is not set in secrets, using fallback placeholder."
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" >> .env
          fi

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "Release keystore decoded successfully."
          else
            echo "No KEYSTORE_BASE64 secret found, skipping release keystore setup."
          fi

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper || true
          fi
          chmod +x ./gradlew

      - name: Run Unit Tests & Security Validation
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Android App (Release & Debug)
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ -f "my-upload-key.jks" ] && [ -n "$CM_KEYSTORE_PASSWORD" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease || {
              echo "Release signing failed, falling back to assembleDebug..."
              ./gradlew assembleDebug
            }
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tawthak-Dental-App-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate Build Summary & Download Link
        if: always()
        run: |
          echo "## 🦷 Tawthak (توثيق) - Build Summary & Direct APK Download" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build and Validation Completed!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 رابط وطريقة تحميل التطبيق (How to Download):" >> $GITHUB_STEP_SUMMARY
          echo "1. انزل لأسفل هذه الصفحة إلى قسم **Artifacts** (المرفقات)." >> $GITHUB_STEP_SUMMARY
          echo "2. اضغط على **Tawthak-Dental-App-APK** لتحميل ملف الـ ZIP." >> $GITHUB_STEP_SUMMARY
          echo "3. فك الضغط وثبت ملف الـ APK (`app-release.apk` أو `app-debug.apk`) على هاتفك مباشرة." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Generated APK Files:" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk/ -type f -name "*.apk" -exec ls -lh {} + | awk '{print "- `" $9 "` (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
